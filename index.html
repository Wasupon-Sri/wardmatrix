<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Manager Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['Inter', 'monospace'] },
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb', 900: '#0f172a' },
                        surface: { 800: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background: radial-gradient(circle at top right, #1e293b, #0f172a); color: white; min-height: 100vh; }
        .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .role-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        .user-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); border-color: #3b82f6; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .role-radio:checked + div { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .role-radio:disabled + div { background-color: #334155; color: #64748b; border-color: #334155; opacity: 0.5; cursor: not-allowed; }
        
        /* Auth Toggle Slider */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #f97316; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        /* Admin Elements */
        .admin-element { display: none !important; }
        .admin-mode .admin-element { display: flex !important; }
    </style>
</head>
<body class="flex flex-col antialiased">

    <div class="container mx-auto p-6 max-w-5xl flex-1 flex flex-col">
        <header class="flex flex-col md:flex-row justify-between items-center mb-12 pt-6">
            <div class="flex items-center gap-4 mb-6 md:mb-0">
                <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center text-2xl shadow-lg shadow-blue-500/20"><i class="fa-solid fa-staff-snake"></i></div>
                <div><h1 class="text-3xl font-bold tracking-tight">Ward Manager</h1><p class="text-slate-400 text-sm font-medium tracking-wide">Internal Medicine • Rajavithi</p></div>
            </div>
            
            <div class="flex gap-3">
                <!-- Role Toggle -->
                <div class="glass-panel p-1.5 rounded-xl flex gap-1">
                    <button onclick="setRole('resident')" id="roleResident" class="role-btn active px-6 py-2.5 rounded-lg text-sm font-bold text-slate-400 transition-all duration-300 flex items-center gap-2"><i class="fa-solid fa-user-doctor"></i> Ward Resident</button>
                    <button onclick="setRole('chief')" id="roleChief" class="role-btn px-6 py-2.5 rounded-lg text-sm font-bold text-slate-400 transition-all duration-300 flex items-center gap-2"><i class="fa-solid fa-user-tie"></i> Ward Chief</button>
                </div>
                
                <!-- Admin Lock -->
                <button onclick="toggleAdminModal()" id="btnAdminToggle" class="glass-panel w-12 rounded-xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition border border-white/5">
                    <i class="fa-solid fa-lock"></i>
                </button>
            </div>
        </header>

        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-slate-200" id="gridTitle">Select Database</h2>
            <button onclick="toggleCreate()" class="glass-panel hover:bg-white/5 px-4 py-3 rounded-xl transition text-sm font-bold flex items-center gap-2 border border-white/10 text-blue-400"><i class="fa-solid fa-plus"></i> New User</button>
        </div>

        <!-- NEW USER CREATION PANEL -->
        <div id="createPanel" class="hidden glass-panel p-6 rounded-2xl mb-8 animate-fade-in border-l-4 border-blue-500">
            <div class="flex justify-between items-start mb-4">
                <h3 class="font-bold text-lg text-white">Initialize New Ward Database</h3>
                
                <!-- Auth Method Toggle -->
                <div class="flex items-center gap-3 bg-slate-800/50 p-2 rounded-lg border border-slate-700">
                    <span class="text-xs font-bold text-slate-400">Master Key</span>
                    <label class="switch">
                        <input type="checkbox" id="authMethodToggle" onchange="toggleAuthFields()">
                        <span class="slider"></span>
                    </label>
                    <span class="text-xs font-bold text-orange-400">Chief Auth</span>
                </div>
            </div>
            
            <div class="space-y-4">
                <div class="flex flex-col md:flex-row gap-4">
                    <input type="text" id="newDbName" placeholder="New Username (e.g. Res_Somsak)" class="flex-1 bg-slate-900/50 border border-slate-600 rounded-xl p-3.5 outline-none focus:border-blue-500 text-white transition placeholder:text-slate-500">
                    
                    <div class="flex gap-2 w-full md:w-auto">
                        <label class="cursor-pointer flex-1">
                            <input type="radio" name="newRole" value="resident" class="role-radio hidden" checked>
                            <div class="border border-slate-600 rounded-xl p-3.5 px-6 text-center text-sm font-bold text-slate-400 transition hover:bg-slate-800 flex items-center justify-center whitespace-nowrap">
                                <i class="fa-solid fa-user-doctor mr-2 text-blue-400"></i> Resident
                            </div>
                        </label>
                        <label class="cursor-pointer flex-1">
                            <input type="radio" name="newRole" value="chief" id="radioChief" class="role-radio hidden">
                            <div class="border border-slate-600 rounded-xl p-3.5 px-6 text-center text-sm font-bold text-slate-400 transition hover:bg-slate-800 flex items-center justify-center whitespace-nowrap">
                                <i class="fa-solid fa-user-tie mr-2 text-orange-400"></i> Chief
                            </div>
                        </label>
                    </div>
                </div>

                <div id="chiefAuthFields" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 bg-orange-900/10 p-4 rounded-xl border border-orange-500/30">
                    <input type="text" id="chiefUsername" placeholder="Your Chief Username" class="bg-slate-900/50 border border-slate-600 rounded-xl p-3 outline-none focus:border-orange-500 text-white">
                    <input type="password" id="chiefPassword" placeholder="Your Password" class="bg-slate-900/50 border border-slate-600 rounded-xl p-3 outline-none focus:border-orange-500 text-white">
                </div>
                
                <div class="flex justify-between items-center mt-2">
                    <p id="authHint" class="text-xs text-slate-500">* System will prompt for Master Key on submit</p>
                    <button onclick="createDB()" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3.5 rounded-xl font-bold shadow-lg shadow-blue-600/20 transition transform active:scale-[0.98] flex items-center gap-2">
                        Create Database <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="loader" class="text-center py-32"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500"></i></div>
        <div id="dbGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 hidden pb-10"></div>
    </div>

    <footer class="text-center py-6 text-slate-600 text-xs">System v4.0 • Developed for Rajavithi Hospital</footer>

    <!-- ADMIN MODAL -->
    <div id="adminModal" class="fixed inset-0 bg-slate-950/90 z-[100] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 shadow-2xl w-80 text-center relative">
            <button onclick="toggleAdminModal()" class="absolute top-4 right-4 text-slate-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 text-xl text-white border border-slate-600"><i class="fa-solid fa-shield-halved"></i></div>
            <h3 class="text-white font-bold mb-1">Admin Access</h3>
            <p class="text-slate-400 text-xs mb-5">Enter Master Key to manage users.</p>
            <input type="password" id="adminPin" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-3 text-center tracking-widest text-lg mb-4 text-white focus:border-blue-500 outline-none transition" placeholder="PIN">
            <button onclick="checkAdmin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg font-bold transition shadow-lg">Unlock Mode</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxZrOuiFqLzmaX9T7PN7xqwV-jvE80dBuNk4Gc3nV1K8-ZZw0YUEYDupPg_RKc1JUFB/exec";
        const APP_URL = "https://wasupon-sri.github.io/wardmatrix/app.html"; 
        
        let currentRole = 'resident'; 
        let allUsers = [];
        let isAdmin = false;
        let globalAdminKey = "";

        window.onload = loadDatabases;

        function setRole(role) {
            currentRole = role;
            document.getElementById('roleResident').classList.toggle('active', role === 'resident');
            document.getElementById('roleChief').classList.toggle('active', role === 'chief');
            document.getElementById('gridTitle').innerText = role === 'chief' ? "Select Ward to Oversee" : "Select Your Database";
            renderGrid();
        }

        function toggleCreate() {
            const el = document.getElementById('createPanel'); el.classList.toggle('hidden');
            if(!el.classList.contains('hidden')) { document.getElementById('newDbName').focus(); }
        }

        function toggleAuthFields() {
            const isChiefAuth = document.getElementById('authMethodToggle').checked;
            const fields = document.getElementById('chiefAuthFields');
            const hint = document.getElementById('authHint');
            const radioChief = document.getElementById('radioChief');
            
            if (isChiefAuth) {
                fields.classList.remove('hidden');
                hint.innerHTML = "<span class='text-orange-400'><i class='fa-solid fa-shield-halved'></i> Creating using Chief privileges</span>";
                radioChief.disabled = true;
                document.querySelector('input[name="newRole"][value="resident"]').checked = true;
            } else {
                fields.classList.add('hidden');
                hint.innerText = "* System will prompt for Master Key on submit";
                radioChief.disabled = false;
            }
        }

        function toggleAdminModal() {
            if (isAdmin) {
                // Logout
                isAdmin = false;
                globalAdminKey = "";
                document.body.classList.remove('admin-mode');
                document.getElementById('btnAdminToggle').innerHTML = '<i class="fa-solid fa-lock"></i>';
                document.getElementById('btnAdminToggle').className = "glass-panel w-12 rounded-xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition border border-white/5";
                renderGrid();
            } else {
                const modal = document.getElementById('adminModal');
                modal.classList.toggle('hidden');
                modal.classList.toggle('flex');
                if(!modal.classList.contains('hidden')) document.getElementById('adminPin').focus();
            }
        }

        async function checkAdmin() {
            const pin = document.getElementById('adminPin').value.trim();
            const btn = event.target;
            btn.innerText = "Checking...";
            
            // Verify via Backend to be safe
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({action: 'auth_verify', password: pin}) });
                const json = await res.json();
                
                if (json.status === 'success' && json.role === 'admin') {
                    isAdmin = true;
                    globalAdminKey = pin;
                    document.getElementById('adminModal').classList.add('hidden');
                    document.getElementById('adminModal').classList.remove('flex');
                    document.body.classList.add('admin-mode');
                    
                    // Change Lock Icon to Unlock
                    const toggleBtn = document.getElementById('btnAdminToggle');
                    toggleBtn.innerHTML = '<i class="fa-solid fa-lock-open"></i>';
                    toggleBtn.className = "glass-panel w-12 rounded-xl flex items-center justify-center text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 transition shadow-glow";
                    
                    renderGrid();
                } else {
                    alert("Invalid Master Key");
                }
            } catch(e) { alert("Verification Failed"); }
            finally { 
                btn.innerText = "Unlock Mode"; 
                document.getElementById('adminPin').value = "";
            }
        }

        async function loadDatabases() {
            try {
                const res = await fetch(`${API_URL}?action=admin_list_users`);
                const json = await res.json();
                if(json.users) { allUsers = json.users; renderGrid(); }
            } catch(e) { alert("Failed to load databases."); }
        }

        function renderGrid() {
            document.getElementById('loader').classList.add('hidden'); const grid = document.getElementById('dbGrid'); grid.classList.remove('hidden');
            const filteredUsers = allUsers.filter(u => u.role === currentRole);
            
            if (filteredUsers.length === 0) { grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500 italic">No ${currentRole} databases found. Create one above.</div>`; return; }

            grid.innerHTML = filteredUsers.map(u => {
                const isChief = u.role === 'chief'; const initial = u.name.charAt(0).toUpperCase(); const icon = isChief ? 'fa-user-tie' : 'fa-user-doctor';
                return `<div onclick="enterApp('${u.name}', '${u.role}')" class="user-card cursor-pointer bg-surface-800/50 border border-slate-700/50 p-6 rounded-2xl transition group relative overflow-hidden backdrop-blur-sm">
                    <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition"><i class="fa-solid ${icon} text-6xl text-white"></i></div>
                    
                    <!-- DELETE BUTTON (Only visible in Admin Mode) -->
                    <button onclick="deleteUser('${u.name}'); event.stopPropagation();" class="admin-element hidden absolute top-4 right-4 w-8 h-8 rounded-lg bg-rose-500/20 text-rose-500 hover:bg-rose-500 hover:text-white items-center justify-center z-20 border border-rose-500/30 transition">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>

                    <div class="flex items-center gap-4 mb-4 relative z-10"><div class="w-12 h-12 rounded-full bg-slate-700/50 ${isChief?'text-orange-400':'text-blue-400'} flex items-center justify-center font-bold text-xl border border-slate-600 group-hover:bg-${isChief?'orange':'blue'}-500 group-hover:text-white transition shadow-inner">${initial}</div><div><h3 class="font-bold text-lg text-white truncate w-32 leading-tight">${u.name}</h3><p class="text-xs text-slate-400 transition uppercase font-bold tracking-wide">${u.role}</p></div></div>
                    <div class="flex items-center justify-between mt-2 pt-4 border-t border-slate-700/50"><span class="text-xs font-mono text-slate-500">Access</span><i class="fa-solid fa-arrow-right text-slate-600 transition transform group-hover:translate-x-1"></i></div></div>`;
            }).join('');
            
            if(isAdmin) document.body.classList.add('admin-mode');
        }

        function enterApp(dbName, role) { window.location.href = `${APP_URL}?db=${dbName}&role=${role}`; }

        async function createDB() {
            const name = document.getElementById('newDbName').value.trim(); 
            const role = document.querySelector('input[name="newRole"]:checked').value;
            const isChiefAuth = document.getElementById('authMethodToggle').checked;
            
            if(!name) return alert("Please enter a username");
            
            let payload = { action: 'admin_create_user', dbName: name, userRole: role };

            if (isChiefAuth) {
                const creator = document.getElementById('chiefUsername').value.trim();
                const pwd = document.getElementById('chiefPassword').value.trim();
                if (!creator || !pwd) return alert("Please enter Chief Credentials");
                payload.creatorDB = creator;
                payload.creatorPwd = pwd;
            } else {
                // If Global Admin is active, skip prompt
                if (isAdmin && globalAdminKey) {
                    payload.adminKey = globalAdminKey;
                } else {
                    const key = prompt("SECURITY CHECK\nPlease enter the Master Key to create a new database:"); 
                    if(!key) return;
                    payload.adminKey = key;
                }
            }

            const btn = event.target; const originalText = btn.innerHTML; btn.innerHTML = "<i class='fa-solid fa-circle-notch fa-spin'></i> Creating..."; btn.disabled = true;
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload)});
                const json = await res.json();
                if(json.status === 'success') { 
                    document.getElementById('newDbName').value = ""; 
                    if(isChiefAuth) { document.getElementById('chiefPassword').value = ""; }
                    toggleCreate(); loadDatabases(); 
                } else { alert(json.error || "Creation failed"); }
            } catch(e) { alert("Network error"); } finally { btn.innerHTML = originalText; btn.disabled = false; }
        }

        async function deleteUser(name) {
            if(!confirm(`PERMANENTLY DELETE user "${name}"?\nAll data in this ward will be lost.`)) return;
            
            // Use global key since we are in admin mode
            const payload = { action: 'admin_delete_user', dbName: name, adminKey: globalAdminKey };
            
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const json = await res.json();
                if(json.status === 'success') { loadDatabases(); } else { alert(json.error); }
            } catch(e) { alert("Network Error"); }
        }
    </script>
</body>
</html>
